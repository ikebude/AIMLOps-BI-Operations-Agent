name: BI Operations Agent CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed Nigerian retail dataset & run 50-question evaluation benchmark
        run: |
          python -m src.bi_agent.evaluate

      - name: Report benchmark numbers
        run: |
          python - <<'PY'
          import json
          d = json.load(open("reports/eval_summary.json"))
          h = d.get("heldout") or {}
          print(f"::notice::in-sample {d['questions_correct']}/{d['questions_total']} ({d['execution_accuracy_pct']}%), "
                f"adversarial blocked {d['adversarial_prompts_blocked']}/{d['adversarial_prompts_total']}, "
                f"held-out {h.get('questions_correct', h.get('correct'))}/{h.get('questions_total', h.get('total'))}, "
                f"median {d['median_latency_ms']} ms, p95 {d['p95_latency_ms']} ms")
          PY
          git diff --stat -- reports/

      - name: Run pytest suite
        run: |
          pytest -q
